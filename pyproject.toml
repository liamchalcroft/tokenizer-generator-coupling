[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenizer-generator-coupling"
version = "1.0.0"
description = "Reproduction code and result data for Tokenizer-Generator Coupling in Medical Image Generation (NeurIPS 2026)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Liam Chalcroft"}]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "medlatents>=0.1.2",
    "medtokenizers>=0.1.2",
    "torch>=2.0",
    "numpy>=1.23",
    "scipy>=1.10",
    "matplotlib==3.10.9",
    "pillow>=10.0",
    "torchmetrics>=1.9.0",
    "lpips>=0.1.4",
    "accelerate>=0.25.0",
    "torch-ema>=0.3",
    "wandb>=0.16.0",
    "medmnist>=3.0.0",
    "safetensors>=0.4.0",
    "tqdm>=4.66.0",
]

[project.urls]
Paper = "https://arxiv.org/abs/2608.07713"
medlatents = "https://github.com/liamchalcroft/medlatents"
medtokenizers = "https://github.com/liamchalcroft/medtokenizers"

[dependency-groups]
dev = ["ruff>=0.4.0"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["scripts", "figures"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = [
    "E501",
    "B905",
    "SIM108",
    "B007",
    "C408",
]

[tool.ruff.lint.per-file-ignores]
"scripts/train_medmnist2d_tokens.py" = ["I001"]
